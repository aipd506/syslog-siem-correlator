[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "syslog-siem-correlator"
version = "0.1.0"
description = "Universal security log parser, temporal sliding window correlator, and SIGMA detection rule engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "aipd506" }
]
keywords = ["security", "siem", "syslog", "sigma", "correlation", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security :: Log Analysis",
]
dependencies = []

[project.scripts]
siemcorrelate = "siemcorrelate.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["siemcorrelate*"]
